# ─────────────────────────────────────────────────────────────────
# ForenseDoc v3.0 — Docker Compose (VPS Produção)
# ─────────────────────────────────────────────────────────────────
# ATENÇÃO: Este arquivo é para a fase de PRODUÇÃO na VPS dedicada.
# Durante o lançamento com fundadores, a infra roda no Railway.
# Referência: implementation-plan.md → Seção "Migração Railway → VPS"
# ─────────────────────────────────────────────────────────────────

version: "3.9"

services:
  # ── Proxy Reverso / TLS ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/letsencrypt:ro
      # Bind mount do build, e não volume nomeado: o volume anterior não era
      # preenchido por serviço nenhum, então o nginx serviria um diretório
      # vazio. O frontend é construído no host (`npm run build`) e entregue
      # daqui, o que também torna um redeploy de tela uma cópia de arquivos,
      # sem rebuild de imagem.
      - ./frontend/dist:/var/www/html:ro
      # Webroot do certbot, para a renovação não exigir parar o nginx.
      - ./nginx/certbot:/var/www/certbot
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - forensedoc_net

  # ── API Backend ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: ./backend/.env.production
    # O dossiê enviado é gravado aqui pela API e lido pelo worker. Precisa ser o
    # MESMO volume nos dois containers: se cada um tiver o seu, o worker procura
    # um arquivo que não existe e a análise falha.
    volumes:
      - uploads:/app/data/uploads
    expose:
      - "8787"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    user: node
    networks:
      - forensedoc_net

  # ── Worker BullMQ (Processamento Assíncrono) ──────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Sem `container_name`: nome fixo impede subir mais de uma réplica, porque
    # dois containers não podem compartilhar o mesmo nome. Aumentar capacidade
    # exigia editar este arquivo.
    #
    #   docker compose up -d --scale worker=4
    #
    # Cada réplica tem a sua própria concorrência por fila (ver src/worker.js),
    # então a vazão total é réplicas x concorrência. A análise é limitada por
    # CPU: não adianta passar do número de núcleos do host somados.
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    command: node src/worker.js
    env_file: ./backend/.env.production
    environment:
      - WORKER_MODE=true
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    user: node
    networks:
      - forensedoc_net

  # ── PostgreSQL 16 ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    env_file: ./backend/.env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forensedoc_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-forensedoc_prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forensedoc_app}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forensedoc_net

  # ── Redis 7 ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    # ── maxmemory e política de despejo ──────────────────────────────────────
    #
    # Sem `maxmemory`, o Redis cresce até derrubar o host, e o sintoma (a máquina
    # inteira travando) não aponta para ele. Mas o valor sozinho não basta: o que
    # decide se a falha é grave ou tolerável é a POLÍTICA.
    #
    # O default é `noeviction`: ao encher, toda escrita falha, inclusive a de
    # enfileirar um job. Uma análise paga deixaria de ser processada.
    #
    # `allkeys-lru` seria pior: despejaria os próprios jobs da fila, e um laudo
    # pago sumiria sem deixar rastro.
    #
    # `volatile-lru` despeja SOMENTE chaves com prazo de validade. É exatamente a
    # divisão que este sistema já tem: cache, rate limit e limites de plano usam
    # `setex` (têm TTL), enquanto os jobs do BullMQ não. Sob pressão de memória o
    # cache encolhe, que é o comportamento correto — todo o cache é fail-open e o
    # pior caso dele é consultar o serviço externo de novo.
    #
    # Ajuste `REDIS_MAXMEMORY` para cerca de 70% da RAM dedicada ao container.
    command: >
      redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-512mb} --maxmemory-policy volatile-lru
    expose:
      - "6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forensedoc_net

volumes:
  # Dossiês enviados, com retenção de 30 dias (rotina purge-uploads, 3h).
  #
  # Precisa entrar no BACKUP junto do banco: sem o arquivo, uma análise dentro da
  # janela de retenção não pode ser reprocessada. Não precisa de retenção longa
  # no backup, pelo contrário: guardar cópia por anos anula a política de 30 dias.
  uploads:
    driver: local
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  forensedoc_net:
    driver: bridge
    internal: false
