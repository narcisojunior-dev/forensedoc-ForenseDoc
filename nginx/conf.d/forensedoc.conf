# ─────────────────────────────────────────────────────────────────────
# ForenseDoc — proxy reverso e entrega do frontend
#
# Trocar `SEU_DOMINIO` pelo domínio real antes de subir.
# ─────────────────────────────────────────────────────────────────────

# HTTP: só existe para o desafio do Let's Encrypt e para redirecionar.
server {
    listen 80;
    server_name SEU_DOMINIO;

    # Renovação por webroot: o certbot escreve aqui e o nginx serve, sem
    # precisar parar o servidor a cada 90 dias.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name SEU_DOMINIO;

    ssl_certificate     /etc/letsencrypt/live/SEU_DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SEU_DOMINIO/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # ── Tamanho do corpo ────────────────────────────────────────────
    #
    # O default do nginx é 1 MB, e o upload de análise chega a 42 MB em
    # base64 (MAX_PDF_MB=30, mais os 33% da codificação). Sem esta linha o
    # nginx devolve 413 antes de a requisição chegar à aplicação, e o erro
    # não passa pelo tratamento dela: o usuário vê uma página de erro do
    # servidor em vez da mensagem de arquivo grande demais.
    client_max_body_size 50m;

    # Análise com OCR pode levar minutos. O default de 60s cortaria a
    # conexão no meio, embora a rota responda 202 rápido.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Réplica processual ──────────────────────────────────────────
    # Os autos chegam juntos em base64: REPLICA_MAX_TOTAL_MB=80 vira ~113 MB
    # no corpo. O limite maior vale só para esta rota; as demais seguem nos
    # 50 MB acima.
    location = /api/replicas {
        client_max_body_size 120m;
        proxy_pass http://backend:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API ─────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # A aplicação usa `trust proxy` e lê daqui o IP do cliente, que vai
        # para o audit log e para os limites por IP. Sem isto, todo mundo
        # aparece como o próprio nginx.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:8787/health;
        access_log off;
    }

    # ── Frontend ────────────────────────────────────────────────────
    root /var/www/html;
    index index.html;

    # Arquivos com hash no nome podem ser cacheados para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer rota desconhecida devolve o index, senão recarregar a
    # página em /historico dá 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
